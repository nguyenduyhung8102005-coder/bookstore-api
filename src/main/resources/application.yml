spring:
  application:
    name: bookstore-api

  # Cú pháp ${TEN_BIEN:gia_tri_mac_dinh}: đọc biến môi trường, nếu không có thì
  # dùng giá trị mặc định. Chạy local không cần cấu hình gì; lên Docker/CI thì
  # chỉ cần truyền biến môi trường, không phải sửa file.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}

  jpa:
    # Tắt Open Session In View: không giữ kết nối DB suốt request, buộc mọi
    # truy vấn phải nằm trong Service. Lỗi lazy-loading sẽ lộ ra sớm thay vì
    # âm thầm sinh thêm query ở tầng Controller (một nguồn gây N+1).
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý. Hibernate chỉ KIỂM TRA entity có khớp với
      # bảng không; lệch là app không khởi động được.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Chặn client gửi ?size=1000000 làm quá tải DB: vượt mức này sẽ bị hạ về 100.
        max-page-size: 100

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Khóa ký JWT, mã hóa Base64, tối thiểu 256 bit (32 byte).
    # Giá trị mặc định dưới đây CHỈ dùng cho máy local và CI. Môi trường thật
    # PHẢI đặt biến JWT_SECRET khác; ai biết khóa này là tự ký được token giả.
    secret: ${JWT_SECRET:3/hUKy/YR7ZQmdE2Gv1RhXJJSl7z85wtueonrxDtl4dUMlEBUF5qbsBxAq2Joaiv}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  admin:
    # Tài khoản ADMIN đầu tiên, chỉ được tạo khi DB chưa có ADMIN nào.
    # Mặc định chỉ để chạy local; môi trường thật đặt ADMIN_EMAIL / ADMIN_PASSWORD.
    email: ${ADMIN_EMAIL:admin@bookstore.local}
    password: ${ADMIN_PASSWORD:Admin@123456}

logging:
  level:
    # Đổi thành DEBUG khi cần xem câu SQL Hibernate sinh ra (dùng ở GĐ 3).
    org.hibernate.SQL: INFO
